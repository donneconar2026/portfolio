const KEY_STORE = "portfolio-key"; const AUTO = "3-ntT-dQBNAJKkCpvJgafIzNHqQHYrOs";

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);

async function decrypt(key, bytes) {
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
}
async function unlockWith(key) {
  const data = JSON.parse(new TextDecoder().decode(await decrypt(key, b64(PAYLOAD))));

      const [path, [name, mime, size]] = entries[idx++];
