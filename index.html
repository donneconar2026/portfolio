      const [path, [name, mime, size]] = entries[idx++];
      const res = await fetch(name);
      if (!res.ok) throw new Error("missing " + name);
      const plain = await decrypt(key, new Uint8Array(await res.arrayBuffer()));
      urls[path] = URL.createObjectURL(new Blob([plain], { type: mime }));
      done += size; $("barFill").style.width = Math.round(done / total * 100) + "%";
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  let html = data.html;
  for (const [path, url] of Object.entries(urls)) html = html.split(path).join(url);
  document.open(); document.write(html); document.close();
}
